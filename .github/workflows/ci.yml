name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The JavaScript logic tests (the dashboard's figures, the mod's shared
      # vectors) skip without Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install -e .[test]

      - name: Test
        run: pytest -q
