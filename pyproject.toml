[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudeglass"
version = "0.14.0"
description = "Are you using Claude Code well? Finds the habits and settings that waste tokens, from the transcripts on your machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Morris" }]
keywords = ["claude", "claude-code", "anthropic", "tokens", "prompt-cache", "usage", "developer-tools", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PaulMorrisDev/claudeglass"
Repository = "https://github.com/PaulMorrisDev/claudeglass"
Changelog = "https://github.com/PaulMorrisDev/claudeglass/blob/main/CHANGELOG.md"

[project.optional-dependencies]
rich = ["rich>=13"]
test = ["pytest>=8"]

[project.scripts]
claudeglass = "claudeglass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claudeglass = ["pricing.toml", "hooks/snapshot-config.py", "hooks/capture-hook.py", "hooks/capture_hook.py", "hooks/capture-catalogue.json", "service/static/*", "service/static/vendor/*", "service/static/fonts/*", "profiles/catalogue/*.toml"]
