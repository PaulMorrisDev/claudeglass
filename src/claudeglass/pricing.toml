version = "2026-10-01"
currency = "USD"
source_url = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved = "2026-10-01"
notes = """
Manually curated USD list prices, per million tokens, read from the
Claude pricing page on the date above. Never fetched automatically (see
the project's non-goals: no network fetch for pricing). Edit this file
directly to correct a rate or add a model; nothing in the codebase hard-
codes a price. cache_write_5m / cache_write_1h are the write rates for a
5-minute and a 1-hour prompt-cache TTL entry respectively; cache_read is
the flat rate for a cache hit regardless of which TTL wrote it. Owner:
confirm these figures against the live pricing page before relying on
them for anything other than relative comparisons.
"""

# Geo multiplier rule: the documented 1.1x "us" data-residency uplift is
# only stated for the 4.6-generation and later models. Earlier models
# (4.5 and below, and every legacy dated id below) deliberately carry no
# [models.<id>.geo_multipliers] table — that's the asymmetry documented
# here, not an omission to fix.

# Context-window rule (D2/D4/COV-12): Fable 5.1, Fable 5, Sonnet 5.5,
# Sonnet 5, Sonnet 4.6 and Opus 4.6+ have a native 1M token context
# window (docs/en/model-config; the 4.6 models need no beta header).
# Those models set context_window_tokens = 1000000 below; every other
# model omits the key and gets pricing.py's 200,000-token default, the
# window every earlier generation shipped with. Claude Code itself
# compacts a 1M-window session before the window fills, at about 967K
# tokens by default — callers that need that trigger point derive it
# from this field (see ModelRates.context_window_tokens's docstring)
# rather than a second hard-coded constant.

# --- Fable ------------------------------------------------------------

[models."claude-fable-5-1"]
aliases = ["fable", "fable[1m]", "best"]
input = 10.0
output = 50.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 0.25
context_window_tokens = 1000000

[models."claude-fable-5-1".geo_multipliers]
us = 1.1 # documented data-residency uplift when usage.inference_geo == "us"

# Long-context pricing is absent by default: the docs state 4.6+ models
# bill the full 1M-token context window at standard rates. Uncomment and
# adjust only if a specific model's pricing page adds a long-context
# tier. Explicit per-rate overrides win over `multiplier` when both are
# present (see pricing.py's price_turn).
# [models."claude-fable-5-1".long_context]
# threshold_tokens = 200000
# multiplier = 1.0
# input = 20.0            # optional explicit overrides, one or more of:
# output = 100.0          # input / output / cache_write_5m /
# cache_write_5m = 25.0   # cache_write_1h / cache_read
# cache_write_1h = 40.0
# cache_read = 0.5

[models."claude-fable-5"]
aliases = []
input = 10.0
output = 50.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 1.0
context_window_tokens = 1000000

# --- Opus ---------------------------------------------------------------

# Fast mode ([models.<id>.fast]): an optional per-model speed tier,
# priced by a flat multiplier over every one of the five standard rates
# (input/output/cache_write_5m/cache_write_1h/cache_read), applied when
# a turn's own usage.speed == "fast". Documented for exactly three
# models today (this one, claude-opus-5, claude-opus-4-8); every other
# model deliberately carries no [.fast] table, so a fast-flagged turn on
# one of them is priced at its standard rate (see pricing.py's
# price_turn and PricingCoverage.fast_priced_as_standard). Cache-write/
# read and data-residency multipliers stack on top of the fast rate
# (documented on the pricing page), not the other way around.

[models."claude-opus-5-5"]
aliases = ["opus", "opus[1m]"]
input = 4.0
output = 20.0
cache_write_5m = 5.0
cache_write_1h = 8.0
cache_read = 0.2 # cache hits are 0.05x input on this model (4.0 * 0.05)
context_window_tokens = 1000000

[models."claude-opus-5-5".geo_multipliers]
us = 1.1 # documented data-residency uplift when usage.inference_geo == "us"

[models."claude-opus-5-5".fast]
multiplier = 2.0 # fast-mode rate is $8/$40 in/out, 2x standard

