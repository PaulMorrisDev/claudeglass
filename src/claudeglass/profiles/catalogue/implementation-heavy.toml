id = "implementation-heavy"
name = "Plan high, implement low"
for = ["implementation", "refactor", "test-triage", "review"]
archetype = "plan-high-implement-low"
notes = """
For the plan-high-implement-low archetype (workstyle.detect_archetype: \
plans at a higher model tier, then hands implementation to lower-tier \
model turns or agents once plan mode exits) and the purposes that tend \
to run this way -- refactor, test-triage, review -- per \
classify.classify_purpose. agents.topology_spawn_write's mean_write \
column (recommend.py's spawn-cost rule threshold) is what a per-agent \
first-turn write cost looks like for the agent that writes code, which \
this profile moves to a lower-tier model at medium effort with a turn \
cap (the [roles.writer] table: it goes to every one of your agents named \
like implementer, fixer or builder that can edit files, so the profile \
needs none of your agent names). subagentPromptCacheTtl is 5m for every \
subagent, whose turns run close together rather than waiting on a long \
verification step, per the plan's "per-subagent TTL" owner note \
(Appendix, "TTL should be chosen per spawned subagent type ... with \
subagentPromptCacheTtl only as the fallback default"); Claude Code reads \
it before any agent file's own "experimental.cacheTtl", so no agent \
file line is needed.
"""

[settings]
effortLevel = "medium"
subagentPromptCacheTtl = "5m"

[roles.writer]
model = "sonnet"
effort = "medium"
maxTurns = 60
